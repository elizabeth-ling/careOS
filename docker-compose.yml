services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: careos
      POSTGRES_PASSWORD: careos
      POSTGRES_DB: careos
    ports:
      - "5432:5432"
    volumes:
      - careos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careos -d careos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  careos_pgdata:
